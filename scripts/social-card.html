<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { position: relative; color: #f1efe8; background: #0d100e; font-family: "Aptos Display", "Segoe UI Variable Display", "Segoe UI", Arial, sans-serif; }
    .grid { position: absolute; inset: 0; opacity: .28; background-image: linear-gradient(rgba(241,239,232,.09) 1px,transparent 1px), linear-gradient(90deg,rgba(241,239,232,.09) 1px,transparent 1px); background-size: 150px 150px; }
    .orb { position: absolute; right: 80px; top: 54px; width: 330px; height: 330px; border-radius: 50%; background: #a73931; }
    .orbit { position: absolute; right: -10px; top: -32px; width: 520px; height: 520px; border: 1px solid rgba(241,239,232,.2); border-radius: 50%; }
    .orbit::after { content: ""; position: absolute; inset: 70px; border: 1px dashed rgba(241,239,232,.26); border-radius: 50%; }
    main { position: relative; z-index: 2; padding: 64px 74px; }
    .brand { display: flex; align-items: center; gap: 18px; font-size: 17px; font-weight: 700; letter-spacing: .04em; }
    .mark { display: grid; place-items: center; width: 52px; height: 52px; border: 1px solid rgba(241,239,232,.35); font: 700 14px Georgia, serif; }
    .brand small { display: block; margin-top: 5px; color: #969c94; font: 600 10px Consolas, monospace; letter-spacing: .18em; text-transform: uppercase; }
    .eyebrow { margin: 70px 0 18px; color: #9eb49b; font: 700 13px Consolas, monospace; letter-spacing: .2em; text-transform: uppercase; }
    h1 { width: 760px; margin: 0; font-size: 78px; font-weight: 650; line-height: .92; letter-spacing: -.05em; }
    h1 em { display: block; margin-left: 82px; color: #d8d6ce; font-style: normal; font-weight: 500; }
    footer { position: absolute; z-index: 2; left: 74px; right: 74px; bottom: 48px; display: flex; justify-content: space-between; align-items: center; padding-top: 20px; border-top: 1px solid rgba(241,239,232,.22); color: #aaaFA8; font-size: 16px; }
    footer strong { color: #ec684a; font: 700 11px Consolas, monospace; letter-spacing: .15em; }
  </style>
</head>
<body>
  <div class="grid"></div><div class="orb"></div><div class="orbit"></div>
  <main>
    <div class="brand"><span class="mark">DVC</span><span>Danilo Cardoso<small>Software e Sistemas</small></span></div>
    <p class="eyebrow">Softwares próprios · Sistemas sob medida</p>
    <h1>Software para <em>operações reais.</em></h1>
  </main>
  <footer><span>Produtos digitais e engenharia de ponta a ponta.</span><strong>CONTATO@DANILOVCARDOSO.COM.BR</strong></footer>
</body>
</html>
